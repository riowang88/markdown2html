server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location = /manifest.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:js|css|map|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control public;
    }

    location /api/upload {
        proxy_pass http://uploader:3001;
        proxy_set_header X-Filename $http_x_filename;
        proxy_set_header X-Token $http_x_token;
        client_max_body_size 10m;
    }

    location /api/yiban/ {
        proxy_pass https://yiban.io/api/;
        proxy_set_header Host yiban.io;
        proxy_set_header Referer https://yiban.io/;
        proxy_ssl_server_name on;
    }
}
